[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protomind-lab"
version = "0.1.0"
description = "Local predator-prey collective intelligence research simulator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
protomind = "protomind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
